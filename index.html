<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Rama · Portofolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #cce4f5;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }

    .bg-foto {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.5;
      z-index: -2;
    }

    .overlay-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(190, 225, 255, 0.2);
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    .card {
      max-width: 800px;
      width: 100%;
      background: transparent;
      padding: 0 15px;
      border: none;
      box-shadow: none;
    }

    .gear-wrap { display: flex; justify-content: flex-end; margin-bottom: 16px; }

    .gear-btn {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(60, 130, 200, 0.25);
      width: 46px; height: 46px;
      border-radius: 60px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #075a87; cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(0, 50, 100, 0.06);
    }
    .gear-btn:hover { background: #c2e4ff; border-color: #3b8fc2; transform: rotate(70deg); }

    .admin-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      padding: 20px 22px;
      border-radius: 26px;
      margin-top: 10px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(0, 70, 120, 0.12);
      border: 1px solid rgba(70, 160, 255, 0.2);
      display: none;
      max-height: 75vh;
      overflow-y: auto;
    }
    .admin-panel.show { display: block; }

    .admin-panel h4 {
      color: #054a72; font-weight: 600; letter-spacing: 0.3px;
      margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem;
    }
    .admin-panel h5 {
      color: #0b5b7a; font-weight: 600; margin: 18px 0 10px;
      font-size: 0.95rem; display: flex; align-items: center; justify-content: space-between;
    }

    .field { margin-bottom: 10px; }
    .field label { display:block; font-size: 0.78rem; color:#0b5b7a; font-weight:600; margin-bottom:4px; }
    .field input, .field textarea, .field select {
      width: 100%;
      padding: 9px 14px;
      border: 1px solid #b0d4f0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      outline: none;
      color: #054a72;
      font-family: inherit;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: #2b7fb0;
      box-shadow: 0 0 0 3px rgba(43, 127, 176, 0.15);
    }
    .field textarea { resize: vertical; min-height: 50px; }
    .row2 { display:flex; gap:8px; }
    .row2 .field { flex:1; }

    .pin-input-group { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .pin-input-group input {
      flex: 1; min-width: 140px; padding: 10px 16px;
      border: 1px solid #b0d4f0; border-radius: 60px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 1rem; outline: none; color: #054a72;
      font-weight: 500; letter-spacing: 1px;
    }
    .pin-input-group input:focus {
      border-color: #2b7fb0; box-shadow: 0 0 0 4px rgba(43, 127, 176, 0.15);
    }

    .btn {
      background: #2b7fb0; border: none; padding: 9px 20px;
      border-radius: 60px; color: white; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; transition: 0.2s;
      box-shadow: 0 6px 16px rgba(43, 127, 176, 0.25);
      display: inline-flex; align-items:center; gap:6px;
    }
    .btn:hover { background: #1a6390; transform: scale(0.97); }
    .btn.secondary { background: rgba(43,127,176,0.12); color:#1a6390; box-shadow:none; border:1px solid rgba(43,127,176,0.3); }
    .btn.secondary:hover { background: rgba(43,127,176,0.2); }
    .btn.danger { background: #c65050; }
    .btn.danger:hover { background: #a83e3e; }
    .btn.small { padding:6px 14px; font-size:0.75rem; }

    .pin-status {
      margin-top: 10px; font-size: 0.85rem; color: #0b5b7a;
      background: rgba(200, 230, 255, 0.5); padding: 6px 16px;
      border-radius: 30px; display: inline-block;
    }

    .admin-block {
      background: rgba(200,225,245,0.35);
      border: 1px solid rgba(70,160,255,0.15);
      border-radius: 18px;
      padding: 12px 14px;
      margin-bottom: 10px;
      position: relative;
    }
    .admin-block .remove-btn {
      position: absolute; top: 10px; right: 10px;
      background: rgba(198,80,80,0.15); color:#a83e3e;
      border: none; width: 26px; height: 26px; border-radius: 50%;
      cursor: pointer; font-size: 0.75rem;
    }
    .admin-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .save-status { font-size: 0.8rem; margin-top:10px; min-height: 18px; }

    .profil-wrapper {
      display: flex; flex-direction: row; align-items: center;
      gap: 28px; margin: 4px 0 20px; background: transparent;
    }
    .foto-kiri { flex-shrink: 0; }
    .foto-bulat {
      width: 110px; height: 110px; border-radius: 50%;
      background: #b5d8f0 center/cover no-repeat;
      border: 4px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 28px -8px rgba(0, 70, 130, 0.15);
    }
    .info-teks { flex: 1; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
    .info-teks h1 {
      font-size: 2.4rem; font-weight: 700; color: #054a72;
      letter-spacing: -0.5px; margin-bottom: 2px;
      text-shadow: 0 2px 8px rgba(255,255,255,0.3);
    }
    .info-teks .sub {
      color: #1a6188; font-weight: 400; font-size: 1rem; opacity: 0.9;
      display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .info-teks .sub i { color: #2f8fc0; }
    .bio-text {
      background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px);
      padding: 6px 18px; border-radius: 60px; display: inline-block;
      color: #054a72; font-weight: 400; font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.25); margin-top: 2px;
    }
    .bio-text i { margin-right: 8px; color: #1978a8; }

    .sosial-section { margin: 12px 0 20px; }
    .sosial-linktree { display: flex; flex-direction: column; gap: 8px; }
    .sosial-linktree a {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(6px);
      padding: 12px 18px; border-radius: 40px; text-decoration: none;
      color: #054a72; font-weight: 500; font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.2); transition: 0.2s;
    }
    .sosial-linktree a i { font-size: 1.3rem; width: 28px; text-align: center; color: #075a87; }
    .sosial-linktree a span { flex: 1; text-align: left; }
    .sosial-linktree a:hover { background: rgba(255, 255, 255, 0.6); transform: scale(1.01); border-color: #8fcbff; }

    .produk-section { margin: 24px 0 12px; }
    .produk-section h3 { color: #054a72; font-weight: 600; letter-spacing: 0.3px; margin-bottom: 16px; font-size: 1.3rem; }
    .produk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .produk-item {
      background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
      border-radius: 24px; padding: 16px 16px 18px;
      box-shadow: 0 8px 20px rgba(0, 60, 110, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.25); transition: 0.25s;
      display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px;
    }
    .produk-item:hover { background: rgba(255, 255, 255, 0.55); transform: scale(1.02); border-color: #8fcbff; box-shadow: 0 12px 28px rgba(0, 80, 140, 0.08); }
    .produk-foto { width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; background: #b8d6ed center/cover no-repeat; margin-bottom: 8px; border: 2px solid rgba(255,255,255,0.2); }
    .produk-item .nama-produk { font-weight: 700; color: #054a72; font-size: 1.1rem; }
    .produk-item .desk-produk { font-size: 0.8rem; color: #1f6390; opacity: 0.75; margin: 2px 0 4px; }
    .produk-item .harga-produk {
      font-weight: 700; color: #075a87; font-size: 1rem;
      background: rgba(255, 255, 255, 0.2); padding: 2px 14px; border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.15); margin: 4px 0;
    }
    .btn-pesan {
      background: #2b7fb0; border: none; padding: 7px 18px; border-radius: 60px;
      color: white; font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 12px rgba(43, 127, 176, 0.15); border: 1px solid rgba(255,255,255,0.15);
      margin-top: 4px; text-decoration:none; display:inline-flex; align-items:center;
    }
    .btn-pesan:hover { background: #1a6390; transform: scale(0.95); }
    .btn-pesan i { font-size: 0.7rem; margin-right: 6px; color: white; }

    .foter {
      margin-top: 28px; padding-top: 14px; border-top: 1px solid rgba(60, 130, 200, 0.12);
      text-align: center; color: #0b4d72; font-size: 0.8rem;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px;
      background: transparent; padding: 10px 0;
    }
    .foter span i { margin: 0 4px; color: #3b8fc2; }
    .foter .made { opacity: 0.7; }

    .loading-msg { text-align:center; color:#0b5b7a; padding: 30px 0; font-size:0.9rem; }

    /* ===== SKELETON LOADING ===== */
    @keyframes skeleton-pulse {
      0% { opacity: 0.55; }
      50% { opacity: 1; }
      100% { opacity: 0.55; }
    }
    .sk {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 12px;
      animation: skeleton-pulse 1.3s ease-in-out infinite;
    }
    /* ===== LOADER (custom) ===== */
    .loader-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 0 80px;
    }
    .loader {
      width: fit-content;
      font-size: 17px;
      font-family: monospace;
      line-height: 1.4;
      font-weight: bold;
      color: #075a87;
      background:
        linear-gradient(#075a87 0 0) left,
        linear-gradient(#075a87 0 0) right;
      background-repeat: no-repeat;
      border-right: 5px solid #0000;
      border-left: 5px solid #0000;
      background-origin: border-box;
      position: relative;
      animation: l9-0 2s infinite;
    }
    .loader::before { content: "Loading Sayang"; }
    .loader::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 0;
      width: 22px;
      height: 60px;
      background:
        linear-gradient(90deg,#075a87 4px,#0000 0 calc(100% - 4px),#075a87 0) bottom            /22px 20px,
        linear-gradient(90deg,#3b8fc2 4px,#0000 0 calc(100% - 4px),#3b8fc2 0) bottom 10px left 0/22px 6px,
        linear-gradient(#075a87 0 0) bottom 3px left 0  /22px 8px,
        linear-gradient(#075a87 0 0) bottom 0   left 50%/8px  16px;
      background-repeat: no-repeat;
      animation: l9-1 2s infinite;
    }
    @keyframes l9-0 {
      0%,25%    { background-size: 50% 100%; }
      25.1%,75% { background-size: 0 0,50% 100%; }
      75.1%,100%{ background-size: 0 0,0 0; }
    }
    @keyframes l9-1 {
      25%   { background-position:bottom, bottom 54px left 0,bottom 3px left 0,bottom 0 left 50%; left:0; }
      25.1% { background-position:bottom, bottom 10px left 0,bottom 3px left 0,bottom 0 left 50%; left:0; }
      50%   { background-position:bottom, bottom 10px left 0,bottom 3px left 0,bottom 0 left 50%; left:calc(100% - 22px); }
      75%   { background-position:bottom, bottom 54px left 0,bottom 3px left 0,bottom 0 left 50%; left:calc(100% - 22px); }
      75.1% { background-position:bottom, bottom 10px left 0,bottom 3px left 0,bottom 0 left 50%; left:calc(100% - 22px); }
    }

    @media (max-width: 600px) {
      .profil-wrapper { gap: 16px; }
      .foto-bulat { width: 80px; height: 80px; }
      .info-teks h1 { font-size: 1.8rem; }
      .info-teks .sub { font-size: 0.85rem; gap: 10px; }
      .bio-text { font-size: 0.8rem; padding: 4px 14px; }
      .produk-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .produk-item { padding: 12px 12px 14px; }
    }
    @media (max-width: 420px) {
      .profil-wrapper { flex-direction: column; text-align: center; }
      .info-teks { align-items: center; text-align: center; }
      .info-teks .sub { justify-content: center; }
      .bio-text { margin-left: auto; margin-right: auto; }
      .foto-bulat { width: 90px; height: 90px; }
      .produk-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-foto"></div>
  <div class="overlay-bg"></div>

  <div class="card">
    <div class="gear-wrap">
      <div class="gear-btn" id="gearToggle" title="Admin panel"><i class="fas fa-cog"></i></div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">

      <!-- LOGIN VIEW -->
      <div id="loginView">
        <h4><i class="fas fa-lock" style="color:#1a6f9c;"></i> Masuk sebagai Admin</h4>
        <div class="pin-input-group">
          <input type="password" id="pinInput" placeholder="Masukkan password admin">
          <button class="btn" id="pinSubmit">Masuk <i class="fas fa-arrow-right"></i></button>
        </div>
        <div id="pinMessage" class="pin-status"><i class="fas fa-info-circle"></i> Masuk untuk mengedit isi portofolio</div>
      </div>

      <!-- EDIT VIEW (muncul setelah login) -->
      <div id="editView" style="display:none;">
        <h4><i class="fas fa-user-shield" style="color:#1a6f9c;"></i> Edit Portofolio
          <button class="btn secondary small" id="logoutBtn" style="margin-left:auto;"><i class="fas fa-right-from-bracket"></i> Keluar</button>
        </h4>

        <h5><i class="fas fa-id-card"></i> Profil</h5>
        <div class="field"><label>Nama</label><input id="f-nama"></div>
        <div class="row2">
          <div class="field"><label>Profesi</label><input id="f-role"></div>
          <div class="field"><label>Lokasi</label><input id="f-lokasi"></div>
        </div>
        <div class="field"><label>Bio singkat</label><textarea id="f-bio"></textarea></div>
        <div class="field"><label>URL Foto Profil</label><input id="f-foto"></div>
        <div class="field"><label>Nomor WhatsApp (format 62xxxxxxxxxx, untuk tombol Pesan)</label><input id="f-wa" placeholder="62812xxxxxxxx"></div>

        <h5><i class="fas fa-share-nodes"></i> Sosial Media <button class="btn secondary small" id="addSocialBtn"><i class="fas fa-plus"></i> Tambah</button></h5>
        <div id="socialList"></div>

        <h5><i class="fas fa-box"></i> Produk <button class="btn secondary small" id="addProductBtn"><i class="fas fa-plus"></i> Tambah</button></h5>
        <div id="productList"></div>

        <div class="admin-actions">
          <button class="btn" id="saveBtn"><i class="fas fa-floppy-disk"></i> Simpan Perubahan</button>
        </div>
        <div class="save-status" id="saveStatus"></div>
      </div>
    </div>

    <!-- KONTEN PUBLIK -->
    <div id="publicContent">
      <div class="loader-wrap"><div class="loader"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    // ====== KONFIGURASI SUPABASE (ISI SETELAH BUAT PROJECT) ======
    const SUPABASE_URL = "https://kaudetdefeyysyptdngx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthdWRldGRlZmV5eXN5cHRkbmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzYyODUsImV4cCI6MjEwMjAxMjI4NX0.yhT_zBdhhwzOwN7fxFlOrFCytcxwH1ROiaGxyXAIcLA";
    const ADMIN_EMAIL = "idzuko14@gmail.com"; // email admin yang dibuat di Supabase Auth
    // ===============================================================

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SOCIAL_ICONS = {
      instagram: { icon: "fab fa-instagram", label: "Instagram" },
      github: { icon: "fab fa-github", label: "GitHub" },
      linkedin: { icon: "fab fa-linkedin-in", label: "LinkedIn" },
      twitter: { icon: "fab fa-twitter", label: "Twitter / X" },
      youtube: { icon: "fab fa-youtube", label: "YouTube" },
      tiktok: { icon: "fab fa-tiktok", label: "TikTok" },
      whatsapp: { icon: "fab fa-whatsapp", label: "WhatsApp" },
      email: { icon: "fas fa-envelope", label: "Email" },
      website: { icon: "fas fa-globe", label: "Website" }
    };

    let currentData = null;

    // ---------- RENDER PUBLIK ----------
    function renderPublic(data) {
      const p = data.profile || {};
      const socials = data.socials || [];
      const products = data.products || [];

      const socialHtml = socials.map(s => {
        const meta = SOCIAL_ICONS[s.platform] || { icon: "fas fa-link", label: s.platform };
        return `<a href="${escapeAttr(s.url)}" target="_blank" rel="noopener"><i class="${meta.icon}"></i><span>${escapeHtml(meta.label)}</span></a>`;
      }).join("");

      const waNumber = (p.nomor_wa || "").replace(/[^0-9]/g, "");

      const productHtml = products.map(prod => {
        const pesanUrl = waNumber
          ? `https://wa.me/${waNumber}?text=${encodeURIComponent("Halo, saya tertarik dengan produk: " + prod.nama)}`
          : "#";
        return `
        <div class="produk-item">
          <div class="produk-foto" style="background-image:url('${escapeAttr(prod.foto_url || '')}');"></div>
          <div class="nama-produk">${escapeHtml(prod.nama || '')}</div>
          <div class="desk-produk">${escapeHtml(prod.deskripsi || '')}</div>
          <div class="harga-produk">${escapeHtml(prod.harga || '')}</div>
          <a class="btn-pesan" href="${pesanUrl}" target="_blank" rel="noopener"><i class="fas fa-shopping-cart"></i> Pesan</a>
        </div>`;
      }).join("");

      document.getElementById("publicContent").innerHTML = `
        <div class="profil-wrapper">
          <div class="foto-kiri"><div class="foto-bulat" style="background-image:url('${escapeAttr(p.foto_url || '')}');" title="Foto ${escapeAttr(p.nama || '')}"></div></div>
          <div class="info-teks">
            <h1>${escapeHtml(p.nama || '')}</h1>
            <div class="sub">
              <span><i class="fas fa-code"></i> ${escapeHtml(p.role || '')}</span>
              <span><i class="fas fa-map-pin"></i> ${escapeHtml(p.lokasi || '')}</span>
            </div>
            <div class="bio-text"><i class="fas fa-quote-left"></i> ${escapeHtml(p.bio || '')}</div>
          </div>
        </div>
        <div class="sosial-section"><div class="sosial-linktree">${socialHtml}</div></div>
        <div class="produk-section">
          <h3><i class="fas fa-box"></i> Produk</h3>
          <div class="produk-grid">${productHtml}</div>
        </div>
        <div class="foter">
          <div class="made"><i class="far fa-copyright"></i> 2026 ${escapeHtml(p.nama || '')} · Portofolio</div>
          <div><i class="fas fa-palette"></i> tema biru muda</div>
        </div>`;
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function escapeAttr(str) { return escapeHtml(str); }

    // ---------- LOAD DATA ----------
    async function loadData() {
      const { data, error } = await sb.from("portfolio").select("*").eq("id", 1).single();
      if (error) {
        document.getElementById("publicContent").innerHTML =
          `<div class="loading-msg"><i class="fas fa-triangle-exclamation"></i> Gagal memuat data.<br><span style="font-size:0.75rem;opacity:0.8;">Detail: ${escapeHtml(error.message || JSON.stringify(error))}</span></div>`;
        console.error(error);
        return;
      }
      currentData = data;
      renderPublic(data);
    }

    // ---------- ADMIN: LOGIN ----------
    const gearBtn = document.getElementById('gearToggle');
    const adminPanel = document.getElementById('adminPanel');
    const loginView = document.getElementById('loginView');
    const editView = document.getElementById('editView');
    const pinInput = document.getElementById('pinInput');
    const pinSubmit = document.getElementById('pinSubmit');
    const pinMessage = document.getElementById('pinMessage');

    gearBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      adminPanel.classList.toggle('show');
      if (adminPanel.classList.contains('show')) {
        const { data: { session } } = await sb.auth.getSession();
        if (session) { showEditView(); } else { showLoginView(); }
      }
    });

    function showLoginView() {
      loginView.style.display = 'block';
      editView.style.display = 'none';
      pinInput.value = '';
      pinMessage.innerHTML = '<i class="fas fa-info-circle"></i> Masuk untuk mengedit isi portofolio';
      pinMessage.style.color = '#0b5b7a';
    }

    function showEditView() {
      loginView.style.display = 'none';
      editView.style.display = 'block';
      populateForm(currentData);
    }

    async function doLogin() {
      const password = pinInput.value.trim();
      if (!password) return;
      pinMessage.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa...';
      const { error } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password });
      if (error) {
        pinMessage.innerHTML = '<i class="fas fa-times-circle" style="color:#b13e3e;"></i> Gagal: ' + escapeHtml(error.message || 'Password salah');
        pinMessage.style.color = '#b13e3e';
        pinInput.value = '';
        pinInput.focus();
        return;
      }
      pinMessage.innerHTML = '<i class="fas fa-check-circle" style="color:#0f7b3a;"></i> Berhasil masuk!';
      setTimeout(showEditView, 400);
    }

    pinSubmit.addEventListener('click', doLogin);
    pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      showLoginView();
    });

    document.addEventListener('click', (e) => {
      const isGear = gearBtn.contains(e.target);
      const isPanel = adminPanel.contains(e.target);
      if (!isGear && !isPanel && adminPanel.classList.contains('show')) adminPanel.classList.remove('show');
    });
    adminPanel.addEventListener('click', (e) => e.stopPropagation());

    // ---------- ADMIN: FORM ----------
    let editingSocials = [];
    let editingProducts = [];

    function populateForm(data) {
      const p = data.profile || {};
      document.getElementById('f-nama').value = p.nama || '';
      document.getElementById('f-role').value = p.role || '';
      document.getElementById('f-lokasi').value = p.lokasi || '';
      document.getElementById('f-bio').value = p.bio || '';
      document.getElementById('f-foto').value = p.foto_url || '';
      document.getElementById('f-wa').value = p.nomor_wa || '';

      editingSocials = JSON.parse(JSON.stringify(data.socials || []));
      editingProducts = JSON.parse(JSON.stringify(data.products || []));
      renderSocialForm();
      renderProductForm();
    }

    function renderSocialForm() {
      const wrap = document.getElementById('socialList');
      wrap.innerHTML = editingSocials.map((s, i) => `
        <div class="admin-block">
          <button class="remove-btn" data-idx="${i}" data-type="social"><i class="fas fa-xmark"></i></button>
          <div class="row2">
            <div class="field"><label>Platform</label>
              <select data-idx="${i}" data-field="platform" class="social-field">
                ${Object.keys(SOCIAL_ICONS).map(k => `<option value="${k}" ${s.platform===k?'selected':''}>${SOCIAL_ICONS[k].label}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>URL</label><input class="social-field" data-idx="${i}" data-field="url" value="${escapeAttr(s.url||'')}"></div>
          </div>
        </div>`).join('') || '<p style="font-size:0.8rem;color:#1a6188;">Belum ada link sosial media.</p>';

      wrap.querySelectorAll('.remove-btn[data-type="social"]').forEach(btn => {
        btn.addEventListener('click', () => { editingSocials.splice(+btn.dataset.idx, 1); renderSocialForm(); });
      });
      wrap.querySelectorAll('.social-field').forEach(el => {
        el.addEventListener('input', () => { editingSocials[+el.dataset.idx][el.dataset.field] = el.value; });
      });
    }

    function renderProductForm() {
      const wrap = document.getElementById('productList');
      wrap.innerHTML = editingProducts.map((prod, i) => `
        <div class="admin-block">
          <button class="remove-btn" data-idx="${i}" data-type="product"><i class="fas fa-xmark"></i></button>
          <div class="field"><label>Nama Produk</label><input class="product-field" data-idx="${i}" data-field="nama" value="${escapeAttr(prod.nama||'')}"></div>
          <div class="field"><label>Deskripsi</label><input class="product-field" data-idx="${i}" data-field="deskripsi" value="${escapeAttr(prod.deskripsi||'')}"></div>
          <div class="row2">
            <div class="field"><label>Harga (contoh: Rp 500.000)</label><input class="product-field" data-idx="${i}" data-field="harga" value="${escapeAttr(prod.harga||'')}"></div>
          </div>
          <div class="field"><label>URL Foto Produk</label><input class="product-field" data-idx="${i}" data-field="foto_url" value="${escapeAttr(prod.foto_url||'')}"></div>
        </div>`).join('') || '<p style="font-size:0.8rem;color:#1a6188;">Belum ada produk.</p>';

      wrap.querySelectorAll('.remove-btn[data-type="product"]').forEach(btn => {
        btn.addEventListener('click', () => { editingProducts.splice(+btn.dataset.idx, 1); renderProductForm(); });
      });
      wrap.querySelectorAll('.product-field').forEach(el => {
        el.addEventListener('input', () => { editingProducts[+el.dataset.idx][el.dataset.field] = el.value; });
      });
    }

    document.getElementById('addSocialBtn').addEventListener('click', () => {
      editingSocials.push({ platform: 'instagram', url: '' });
      renderSocialForm();
    });
    document.getElementById('addProductBtn').addEventListener('click', () => {
      editingProducts.push({ nama: '', deskripsi: '', harga: '', foto_url: '' });
      renderProductForm();
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const statusEl = document.getElementById('saveStatus');
      statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
      statusEl.style.color = '#0b5b7a';

      const newProfile = {
        nama: document.getElementById('f-nama').value.trim(),
        role: document.getElementById('f-role').value.trim(),
        lokasi: document.getElementById('f-lokasi').value.trim(),
        bio: document.getElementById('f-bio').value.trim(),
        foto_url: document.getElementById('f-foto').value.trim(),
        nomor_wa: document.getElementById('f-wa').value.trim()
      };

      const { data, error } = await sb.from('portfolio')
        .update({ profile: newProfile, socials: editingSocials, products: editingProducts, updated_at: new Date().toISOString() })
        .eq('id', 1)
        .select()
        .single();

      if (error) {
        statusEl.innerHTML = '<i class="fas fa-triangle-exclamation" style="color:#b13e3e;"></i> Gagal menyimpan: ' + escapeHtml(error.message);
        statusEl.style.color = '#b13e3e';
        console.error(error);
        return;
      }
      currentData = data;
      renderPublic(data);
      statusEl.innerHTML = '<i class="fas fa-check-circle" style="color:#0f7b3a;"></i> Perubahan tersimpan!';
      statusEl.style.color = '#0f7b3a';
    });

    loadData();
  })();
  </script>
</body>
</html>
