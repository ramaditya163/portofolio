        viewport.style.height = vh + 'px';
        baseScale = Math.max(vw / natW, vh / natH);
        x = (vw - natW * baseScale) / 2; y = (vh - natH * baseScale) / 2;
        clamp(); applyTransform();
        hint.textContent = aspect === 'auto' ? 'Geser untuk atur posisi, geser slider untuk zoom' : 'Geser untuk atur posisi, geser slider untuk zoom';
      };
      img.src = url;

      function ptDown(e){
        dragging = true;
        const p = e.touches ? e.touches[0] : e;
        lastX = p.clientX; lastY = p.clientY;
      }
      function ptMove(e){
        if (!dragging) return;
        e.preventDefault();
        const p = e.touches ? e.touches[0] : e;
        x += p.clientX - lastX; y += p.clientY - lastY;
        lastX = p.clientX; lastY = p.clientY;
        clamp(); applyTransform();
      }
      function ptUp(){ dragging = false; }

      viewport.addEventListener('mousedown', ptDown);
      viewport.addEventListener('touchstart', ptDown, { passive:true });
      window.addEventListener('mousemove', ptMove);
      window.addEventListener('touchmove', ptMove, { passive:false });
      window.addEventListener('mouseup', ptUp);
      window.addEventListener('touchend', ptUp);

      zoomSlider.addEventListener('input', () => { zoom = parseFloat(zoomSlider.value); clamp(); applyTransform(); });

      function cleanup(){
        window.removeEventListener('mousemove', ptMove);
        window.removeEventListener('touchmove', ptMove);
        window.removeEventListener('mouseup', ptUp);
        window.removeEventListener('touchend', ptUp);
        URL.revokeObjectURL(url);
        overlay.remove();
      }

      overlay.querySelector('#cropCancel').addEventListener('click', () => { cleanup(); reject(new Error('dibatalkan')); });
      overlay.querySelector('#cropConfirm').addEventListener('click', () => {
        const outW = cropAspect >= 1 ? 900 : Math.round(900 * cropAspect);
        const outH = Math.round(outW / cropAspect);
        const canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        const ctx = canvas.getContext('2d');
        const scale = baseScale * zoom;
        const sx = -x / scale, sy = -y / scale, sw = vw / scale, sh = vh / scale;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        canvas.toBlob((blob) => { cleanup(); resolve(blob); }, 'image/jpeg', 0.87);
      });
    });
  }

  async function pickCropUpload(aspect, round, folder){

  // ================= VIEWER FOTO FULLSCREEN (pinch zoom) =================
  function openImageViewer(src){
    const overlay = document.createElement('div');
    overlay.className = 'imgview-overlay';
    overlay.innerHTML = `<div class="imgview-close" id="imgvClose"><i class="fas fa-xmark"></i></div><img id="imgvImg" src="${escapeAttr(src)}">`;
    document.body.appendChild(overlay);
    const img = overlay.querySelector('#imgvImg');

    let scale = 1, x = 0, y = 0;
    let lastDist = null, lastMid = null;
    const pointers = new Map();

    function fitImage(){
      // pusatkan gambar begitu selesai load, ukuran natural agar bisa di-scale bebas
      const vw = window.innerWidth, vh = window.innerHeight;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const fitScale = Math.min(vw / iw, vh / ih);
      img.style.width = iw + 'px';
      img.style.height = ih + 'px';
      scale = fitScale; x = (vw - iw * fitScale) / 2; y = (vh - ih * fitScale) / 2;
      apply();
    }
    function apply(){
      img.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      img.style.transformOrigin = '0 0';
      img.style.position = 'absolute'; img.style.top = '0'; img.style.left = '0';
    }
    function dist(p1, p2){ return Math.hypot(p1.x - p2.x, p1.y - p2.y); }
    function mid(p1, p2){ return { x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 }; }

    if (img.complete && img.naturalWidth) fitImage(); else img.onload = fitImage;

    let dragStart = null;
    overlay.addEventListener('pointerdown', e => {
      overlay.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if (pointers.size === 1) dragStart = { x:e.clientX, y:e.clientY, ox:x, oy:y };
      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        lastDist = dist(pts[0], pts[1]);
        lastMid = mid(pts[0], pts[1]);
      }
    });
    overlay.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const d = dist(pts[0], pts[1]);
        const m = mid(pts[0], pts[1]);
        if (lastDist) {
          const factor = d / lastDist;
          const newScale = Math.min(6, Math.max(0.5, scale * factor));
          x = m.x - ((m.x - x) / scale) * newScale;
          y = m.y - ((m.y - y) / scale) * newScale;
          scale = newScale;
          apply();
        }
        lastDist = d; lastMid = m;
      } else if (pointers.size === 1 && dragStart) {
        x = dragStart.ox + (e.clientX - dragStart.x);
        y = dragStart.oy + (e.clientY - dragStart.y);
        apply();
      }
    });
    function endPointer(e){
      pointers.delete(e.pointerId);
      if (pointers.size < 2) { lastDist = null; }
      if (pointers.size === 1) {
        const pts = [...pointers.values()];
        dragStart = { x:pts[0].x, y:pts[0].y, ox:x, oy:y };
      }
    }
    overlay.addEventListener('pointerup', endPointer);
    overlay.addEventListener('pointercancel', endPointer);

    let lastTap = 0;
    overlay.addEventListener('pointerup', e => {
      if (pointers.size > 0) return;
      const now = Date.now();
      if (now - lastTap < 300) {
        scale = scale > 1.5 ? Math.min(scale, 1) : scale * 2.5;
        apply();
      }
      lastTap = now;
    });

    function close(){ overlay.remove(); }
    overlay.querySelector('#imgvClose').addEventListener('click', close);
  }

        <div class="foto-thumbs" id="fotoThumbs"></div>
        <div class="field"><label>Nama Produk</label><input id="f-nama" value="${escapeAttr(prod.nama||'')}"></div>
        <div class="field"><label>Deskripsi</label><textarea id="f-deskripsi">${escapeHtml(prod.deskripsi||'')}</textarea></div>
        <div class="field"><label>Harga (contoh: Rp 500.000)</label><input id="f-harga" value="${escapeAttr(prod.harga||'')}"></div>
        <div class="field"><label>Link Pesan (WA / marketplace / form order)</label><input id="f-link" placeholder="https://wa.me/62xxxxxxxxxx" value="${escapeAttr(prod.link_pesan||'')}"></div>
        <button class="btn wide" id="saveBtn"><i class="fas fa-floppy-disk"></i> Simpan Produk</button>
        ${editingProductIndex!==null ? '<button class="btn danger wide" id="delBtn" style="margin-top:10px;"><i class="fas fa-trash"></i> Hapus Produk</button>' : ''}
        <div class="save-status" id="saveStatus"></div>
      </div>`;
    document.getElementById('back').addEventListener('click', renderProdukListPage);
    renderFotoThumbs();
    document.getElementById('saveBtn').addEventListener('click', saveProduk);
    const delBtn = document.getElementById('delBtn');
    if (delBtn) delBtn.addEventListener('click', () => {
      if (!confirm('Hapus produk ini?')) return;
      adminWorking.products.splice(editingProductIndex, 1);
      const statusEl = document.createElement('div');
      saveField({ products: adminWorking.products }, statusEl, renderProdukListPage);
    });
  }
  function renderFotoThumbs(){
    const wrap = document.getElementById('fotoThumbs');
    wrap.innerHTML = editingProduct.fotos.map((f, i) => `
      <div class="foto-thumb-wrap"><img src="${escapeAttr(f)}"><button class="rm-thumb" data-idx="${i}"><i class="fas fa-xmark"></i></button></div>
    `).join('') + `<div class="foto-add-btn" id="addFotoBtn"><i class="fas fa-plus"></i></div>`;
    wrap.querySelectorAll('.rm-thumb').forEach(btn => btn.addEventListener('click', () => { editingProduct.fotos.splice(+btn.dataset.idx,1); renderFotoThumbs(); }));
    document.getElementById('addFotoBtn').addEventListener('click', async () => {
      try {
        const url = await pickCropUpload('auto', false, 'products');
        editingProduct.fotos.push(url);
        renderFotoThumbs();
      } catch(e) { if (e.message !== 'dibatalkan') alert('Gagal upload foto: ' + e.message); }
    });
  }
  function saveProduk(){
    editingProduct.nama = document.getElementById('f-nama').value.trim();
    editingProduct.deskripsi = document.getElementById('f-deskripsi').value.trim();
    editingProduct.harga = document.getElementById('f-harga').value.trim();
    editingProduct.link_pesan = document.getElementById('f-link').value.trim();
    delete editingProduct.foto_url;
    if (editingProductIndex === null) adminWorking.products.push(editingProduct);
    else adminWorking.products[editingProductIndex] = editingProduct;
    saveField({ products: adminWorking.products }, document.getElementById('saveStatus'), renderProdukListPage);
  }

  loadData();
})();
</script>
</body>
</html>
